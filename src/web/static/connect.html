<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MAYA - Connect</title>
<link rel="icon" href="/static/logo/maya-logo-64.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/logo.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/pet-lines.js" defer></script>
<script src="/static/pet-brain.js" defer></script>
<script src="/static/pet.js" defer></script>
<script src="/static/guide.js" defer></script>
</head>
<body class="center-page">
<div class="corner">
<span id="who" class="who"></span>
<button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">&#9680;</button>
<button id="signout" class="btn btn-quiet" type="button">Sign out</button>
</div>
<main class="card">
<div class="brand brand-lg"><span class="maya-logo-slot" data-size="64" aria-hidden="true"></span><span class="wordmark">MAY<span class="wm-a">A</span></span></div>
<h1 class="title">Connect MAYA for security checks?</h1>
<p class="sub">You will see exactly what MAYA does before anything runs, and you can stop at any time.</p>
<div class="actions">
<button id="connect-yes" class="btn btn-primary" type="button">Yes, continue</button>
<button id="connect-no" class="btn btn-secondary" type="button">Not now</button>
</div>
<p id="message" class="message" role="status"></p>
</main>
<p class="footnote">MAYA runs read-only checks on sites you own. Nothing changes without your approval.</p>
</body>
</html>
